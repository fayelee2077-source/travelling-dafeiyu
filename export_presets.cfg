[preset.0]

name="dafeiyu-windows"
platform="Windows Desktop"
runnable=true
dedicated_server=false
custom_features="dafeiyu"
export_filter="all_resources"
include_filter="assets/ai_home/*.json,assets/travel/*.json"
exclude_filter="tools/*,dsh-plugin/*,build/*,release/*,assets/styles/*"
export_path="build/dafeiyu_windows/dafeiyu.exe"

[preset.0.options]

binary_format/embed_pck=true
binary_format/architecture="x86_64"
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
debug/export_console_wrapper=0
application/modify_resources=false
application/product_name="旅行的大肥鱼"
application/file_description="旅行的大肥鱼"

[preset.1]

name="dafeiyu-web"
platform="Web"
runnable=false
dedicated_server=false
custom_features="dafeiyu"
export_filter="all_resources"
include_filter="assets/ai_home/*.json,assets/travel/*.json"
exclude_filter="tools/*,dsh-plugin/*,build/*,release/*,assets/styles/*"
export_path="build/dafeiyu_web/index.html"

[preset.1.options]

variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=false
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
progressive_web_app/enabled=false
